<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lernhub – Quiz</title>

<style>
  /* ============================================================
     Gleiche neutrale Optik wie login.html, damit beide Seiten
     zusammen passen. Schriftgröße wird über --font-scale
     gesteuert (siehe Einstellungen-Schieberegler weiter unten).
     ============================================================ */
  :root {
    --bg: #1b1f2a;
    --card-bg: #ffffff;
    --text-main: #1b1f2a;
    --text-muted: #5a6072;
    --accent: #5b6cff;
    --accent-hover: #4653d1;
    --correct: #1f9d55;
    --wrong: #d13a3a;
    --radius: 999px;
    --radius-card: 24px;
    --font-scale: 1;
  }

  * { box-sizing: border-box; }

  html { font-size: calc(16px * var(--font-scale)); }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #2a3050 0%, var(--bg) 70%);
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    color: var(--text-main);
    padding: 24px;
    display: flex;
    justify-content: center;
    position: relative;
  }

  /* ============================================================
     THEME-SYSTEM
     ------------------------------------------------------------
     Jedes Theme setzt eigene Werte für die CSS-Variablen oben
     (Farben) und stylt zusätzlich #theme-fx sowie .particle, um
     einen animierten Hintergrundeffekt zu erzeugen. Die Klasse
     (theme-einhorn / theme-himalaya / theme-dschungel) wird per
     JavaScript auf <body> gesetzt (siehe "THEME ANWENDEN" weiter
     unten im Script).

     #theme-fx liegt fest über dem ganzen Bildschirm, aber HINTER
     der eigentlichen App (z-index: -1), und enthält die per JS
     erzeugten "Partikel" (Glitzer / Schneeflocken / Dschungel-Glut).
     ============================================================ */

  #theme-fx {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    pointer-events: none;
  }

  /* ---------- Theme: Einhorn (bunt, Glitzer, Regenbogenwelle) ---------- */
  body.theme-einhorn {
    --text-main: #3b1550;
    --text-muted: #7a5b95;
    --accent: #ff5ca8;
    --accent-hover: #e84e94;
    background: #2a1b3d;
  }
  body.theme-einhorn #theme-fx {
    background: linear-gradient(120deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1, #8fd3f4, #ff9a9e);
    background-size: 400% 400%;
    animation: rainbowShift 18s ease infinite;
  }
  @keyframes rainbowShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  body.theme-einhorn .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px 2px rgba(255,255,255,0.9);
    animation: twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* ---------- Theme: Himalaya (hell, Schnee-Landschaft) ---------- */
  body.theme-himalaya {
    --text-main: #173b45;
    --text-muted: #4c7a86;
    --accent: #3fb6c9;
    --accent-hover: #2f9dae;
    background: #cdeef5;
  }
  body.theme-himalaya #theme-fx {
    background: linear-gradient(180deg, #cdeef5 0%, #eaf6f2 55%, #fffdf6 100%);
  }
  body.theme-himalaya .particle {
    position: absolute;
    top: -8%;
    color: #ffffff;
    font-size: 14px;
    text-shadow: 0 0 4px rgba(255,255,255,0.95);
    animation: snowfall linear infinite;
  }
  @keyframes snowfall {
    to { transform: translateY(115vh) translateX(24px); }
  }

  /* ---------- Theme: Dschungel (dunkel, warme Akzente) ---------- */
  body.theme-dschungel {
    --card-bg: #122318;
    --text-main: #eaf5ea;
    --text-muted: #9db99f;
    --accent: #e8622c;
    --accent-hover: #c94f20;
    --correct: #5fce7a;
    --wrong: #ff6b6b;
    background: #0d1b12;
  }
  body.theme-dschungel #theme-fx {
    background:
      radial-gradient(circle at 18% 20%, rgba(232,98,44,0.28), transparent 42%),
      radial-gradient(circle at 82% 28%, rgba(155,60,200,0.22), transparent 46%),
      radial-gradient(circle at 50% 92%, rgba(255,150,30,0.16), transparent 50%),
      #0d1b12;
  }
  body.theme-dschungel .particle {
    position: absolute;
    border-radius: 50%;
    filter: blur(22px);
    animation: glowPulse 6s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.75; }
  }

  /* Wer reduzierte Bewegung eingestellt hat, bekommt keine Animation
     aufgezwungen (Barrierefreiheit) — die Farben bleiben aber sichtbar. */
  @media (prefers-reduced-motion: reduce) {
    #theme-fx, .particle { animation: none !important; }
  }

  .app {
    width: 100%;
    max-width: 640px;
  }

  /* ---------- Kopfleiste: Fragenzähler, Fortschritt, Einstellungen/Logout ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #fff;
    margin-bottom: 12px;
  }

  .topbar .counter {
    font-weight: 700;
    font-size: 1.05rem;
  }

  .topbar .icon-btn {
    background: rgba(255,255,255,0.12);
    border: none;
    color: #fff;
    border-radius: var(--radius);
    padding: 8px 16px;
    cursor: pointer;
    font-size: 0.9rem;
    margin-left: 8px;
  }

  .progress-track {
    width: 100%;
    height: 10px;
    background: rgba(255,255,255,0.15);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 24px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.25s ease;
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius-card);
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

  h1 { font-size: 1.4rem; margin: 0 0 6px; }
  p.hint { color: var(--text-muted); margin: 0 0 24px; }

  /* ---------- Theme-Auswahlkarten ---------- */
  .theme-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  .theme-card {
    border: 2px solid #e2e4ee;
    background: #fafbff;
    border-radius: 24px;
    padding: 16px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .theme-card:hover { border-color: var(--accent); }

  .theme-swatch {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: block;
  }
  .theme-swatch-einhorn {
    background: linear-gradient(135deg, #ff9a9e, #fbc2eb, #8fd3f4, #a18cd1);
  }
  .theme-swatch-himalaya {
    background: linear-gradient(135deg, #cdeef5, #eaf6f2, #fffdf6);
    border: 1px solid #d8ecef;
  }
  .theme-swatch-dschungel {
    background: radial-gradient(circle at 30% 30%, #e8622c, #123822 70%);
  }

  .theme-name { font-weight: 700; font-size: 0.95rem; }

  /* ---------- Auswahl-Bildschirm ---------- */
  .count-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }

  .count-btn, .secondary-btn, .primary-btn {
    border: 2px solid var(--accent);
    background: #fff;
    color: var(--accent);
    border-radius: var(--radius);
    padding: 16px 0;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .count-btn:hover, .secondary-btn:hover { background: #eef0ff; }

  .primary-btn {
    background: var(--accent);
    color: #fff;
    width: 100%;
    padding: 14px 0;
  }
  .primary-btn:hover { background: var(--accent-hover); }
  .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .review-btn {
    width: 100%;
    margin-top: 4px;
  }

  /* ---------- Frage-Bildschirm ---------- */
  .question-text {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .options { display: flex; flex-direction: column; gap: 12px; }

  .option-btn {
    text-align: left;
    border: 2px solid #e2e4ee;
    background: #fafbff;
    border-radius: 20px; /* rundlich statt spitz, aber Fließtext bleibt lesbar */
    padding: 14px 18px;
    font-size: 1rem;
    line-height: 1.4;
    cursor: pointer;
    display: flex;
    gap: 10px;
  }

  .option-btn .letter {
    font-weight: 800;
    color: var(--accent);
    flex-shrink: 0;
  }

  .option-btn:hover:not(:disabled) { border-color: var(--accent); }
  .option-btn:disabled { cursor: default; }

  .option-btn.correct {
    border-color: var(--correct);
    background: #e9f9ef;
  }
  .option-btn.wrong {
    border-color: var(--wrong);
    background: #fceceb;
  }

  .explanation {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 16px;
    background: #f4f5fb;
    font-size: 0.95rem;
    line-height: 1.5;
    display: none;
  }
  .explanation.visible { display: block; }

  .nav-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 26px;
  }
  .nav-row button { flex: 1; }

  /* ---------- Auswertung ---------- */
  .result-grade {
    font-size: 3rem;
    font-weight: 800;
    text-align: center;
    color: var(--accent);
    margin: 8px 0;
  }
  .result-stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 24px;
    text-align: center;
  }
  .result-stats div span {
    display: block;
    font-size: 1.5rem;
    font-weight: 700;
  }
  .result-stats .ok span { color: var(--correct); }
  .result-stats .bad span { color: var(--wrong); }

  /* ---------- Einstellungen-Panel ---------- */
  .settings-panel {
    background: var(--card-bg);
    border-radius: var(--radius-card);
    padding: 24px;
    margin-bottom: 16px;
    display: none;
  }
  .settings-panel.visible { display: block; }
  .settings-panel label { font-weight: 600; display: block; margin-bottom: 10px; }
  .settings-panel input[type="range"] { width: 100%; }

  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .progress-fill { transition: none; }
  }
</style>
</head>
<body>

<!-- Hintergrund-Effekt-Ebene für die Themes (Glitzer / Schnee / Dschungel-Glut).
     Bleibt leer, solange kein Theme gewählt ist. -->
<div id="theme-fx" aria-hidden="true"></div>

<div class="app">

  <!-- Kopfleiste: Fragenzähler links, Einstellungen/Logout rechts -->
  <div class="topbar">
    <span class="counter" id="question-counter">Lernhub</span>
    <div>
      <button class="icon-btn" id="settings-toggle" type="button">Einstellungen</button>
      <button class="icon-btn" id="logout-btn" type="button">Abmelden</button>
    </div>
  </div>

  <!-- Fortschrittsbalken (nur während des Quiz sichtbar) -->
  <div class="progress-track" id="progress-track" hidden>
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <!-- Einstellungen: Schriftgröße in 5 Stufen + Theme wechseln -->
  <div class="settings-panel" id="settings-panel">
    <label for="font-size-slider">Schriftgröße</label>
    <input type="range" id="font-size-slider" min="1" max="5" step="1" value="2">
    <button class="secondary-btn" id="change-theme-btn" type="button" style="width:100%; margin-top:16px;">
      Theme wechseln
    </button>
  </div>

  <!-- ===================== BILDSCHIRM 0: THEME-AUSWAHL ===================== -->
  <section class="card hidden" id="screen-theme">
    <h1>Wähle dein Theme</h1>
    <p class="hint">Du kannst es später jederzeit in den Einstellungen ändern.</p>

    <div class="theme-grid">
      <button class="theme-card" data-theme="einhorn" type="button">
        <span class="theme-swatch theme-swatch-einhorn"></span>
        <span class="theme-name">Einhorn</span>
      </button>
      <button class="theme-card" data-theme="himalaya" type="button">
        <span class="theme-swatch theme-swatch-himalaya"></span>
        <span class="theme-name">Himalaya</span>
      </button>
      <button class="theme-card" data-theme="dschungel" type="button">
        <span class="theme-swatch theme-swatch-dschungel"></span>
        <span class="theme-name">Dschungel</span>
      </button>
    </div>
  </section>

  <!-- ===================== BILDSCHIRM 1: AUSWAHL ===================== -->
  <section class="card" id="screen-select">
    <h1>Wie viele Fragen möchtest du üben?</h1>
    <p class="hint" id="pool-info">Fragen werden geladen …</p>

    <div class="count-grid">
      <button class="count-btn" data-count="10" type="button">10 Fragen</button>
      <button class="count-btn" data-count="15" type="button">15 Fragen</button>
      <button class="count-btn" data-count="20" type="button">20 Fragen</button>
      <button class="count-btn" data-count="25" type="button">25 Fragen</button>
    </div>

    <button class="secondary-btn review-btn hidden" id="review-btn" type="button">
      Falsch beantwortete wiederholen
    </button>
  </section>

  <!-- ===================== BILDSCHIRM 2: QUIZ ===================== -->
  <section class="card hidden" id="screen-quiz">
    <p class="question-text" id="question-text"></p>
    <div class="options" id="options-container"></div>
    <div class="explanation" id="explanation"></div>

    <div class="nav-row">
      <button class="secondary-btn" id="prev-btn" type="button">Zurück</button>
      <button class="primary-btn" id="next-btn" type="button" disabled>Weiter</button>
    </div>
  </section>

  <!-- ===================== BILDSCHIRM 3: AUSWERTUNG ===================== -->
  <section class="card hidden" id="screen-result">
    <h1 style="text-align:center;">Auswertung</h1>
    <p class="result-grade" id="result-grade">–</p>
    <p class="hint" style="text-align:center;" id="result-percent"></p>

    <div class="result-stats">
      <div class="ok"><span id="result-correct">0</span>richtig</div>
      <div class="bad"><span id="result-wrong">0</span>falsch</div>
    </div>

    <div class="nav-row">
      <button class="secondary-btn" id="back-to-select-btn" type="button">Zurück zur Auswahl</button>
      <button class="primary-btn" id="retry-btn" type="button">Nochmal mischen</button>
    </div>
  </section>

</div>

<script type="module">
  // --- 1. Firebase-Bausteine importieren -------------------------
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import { initializeAppCheck, ReCaptchaV3Provider }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app-check.js";
  import {
    getFirestore, doc, setDoc, getDocs, collection, query, where, increment
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  import { firebaseConfig, recaptchaSiteKey } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  initializeAppCheck(app, {
    provider: new ReCaptchaV3Provider(recaptchaSiteKey),
    isTokenAutoRefreshEnabled: true
  });

  // --- 2. Elemente aus dem HTML holen -----------------------------
  const screenSelect = document.getElementById("screen-select");
  const screenQuiz = document.getElementById("screen-quiz");
  const screenResult = document.getElementById("screen-result");

  const poolInfo = document.getElementById("pool-info");
  const reviewBtn = document.getElementById("review-btn");
  const countButtons = document.querySelectorAll(".count-btn");

  const questionCounterEl = document.getElementById("question-counter");
  const progressTrack = document.getElementById("progress-track");
  const progressFill = document.getElementById("progress-fill");

  const questionTextEl = document.getElementById("question-text");
  const optionsContainer = document.getElementById("options-container");
  const explanationEl = document.getElementById("explanation");
  const prevBtn = document.getElementById("prev-btn");
  const nextBtn = document.getElementById("next-btn");

  const resultGrade = document.getElementById("result-grade");
  const resultPercent = document.getElementById("result-percent");
  const resultCorrect = document.getElementById("result-correct");
  const resultWrong = document.getElementById("result-wrong");
  const backToSelectBtn = document.getElementById("back-to-select-btn");
  const retryBtn = document.getElementById("retry-btn");

  const settingsToggle = document.getElementById("settings-toggle");
  const settingsPanel = document.getElementById("settings-panel");
  const fontSlider = document.getElementById("font-size-slider");
  const logoutBtn = document.getElementById("logout-btn");

  const screenTheme = document.getElementById("screen-theme");
  const themeButtons = document.querySelectorAll(".theme-card");
  const changeThemeBtn = document.getElementById("change-theme-btn");
  const themeFx = document.getElementById("theme-fx");

  // --- 3. Zustand (State) der App ----------------------------------
  let currentUser = null;
  let allQuestions = [];      // komplette Fragen aus questions.json (mit id)
  let sessionQuestions = [];  // die für diese Runde ausgewählten Fragen
  let answers = [];           // Antworten der aktuellen Runde: {questionId, selected, isCorrect}
  let currentIndex = 0;

  // --- 4. Anmeldung prüfen ------------------------------------------
  // Wer nicht eingeloggt ist, darf diese Seite nicht sehen.
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }
    currentUser = user;
    await loadQuestions();
    await checkReviewPool();

    // Wurde schon einmal ein Theme gewählt? Dann direkt anwenden und
    // zur Fragenanzahl-Auswahl springen. Sonst zuerst die Theme-Wahl zeigen.
    const savedTheme = localStorage.getItem("lernhub-theme");
    if (savedTheme) {
      applyTheme(savedTheme);
    } else {
      screenSelect.classList.add("hidden");
      screenTheme.classList.remove("hidden");
    }
  });

  // --- 4b. Theme anwenden + Hintergrund-Partikel erzeugen -------------
  function applyTheme(theme) {
    document.body.classList.remove("theme-einhorn", "theme-himalaya", "theme-dschungel");
    document.body.classList.add("theme-" + theme);
    localStorage.setItem("lernhub-theme", theme);
    generateParticles(theme);
  }

  function generateParticles(theme) {
    themeFx.innerHTML = "";

    // Wer "reduzierte Bewegung" bevorzugt, bekommt trotzdem die
    // Theme-Farben, aber keine (oder deutlich weniger) Animation.
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (theme === "einhorn") {
      const count = reduceMotion ? 8 : 28;
      for (let i = 0; i < count; i++) {
        const p = document.createElement("span");
        p.className = "particle";
        p.style.left = Math.random() * 100 + "%";
        p.style.top = Math.random() * 100 + "%";
        p.style.animationDelay = (Math.random() * 2.4) + "s";
        themeFx.appendChild(p);
      }
    } else if (theme === "himalaya") {
      const count = reduceMotion ? 6 : 22;
      for (let i = 0; i < count; i++) {
        const p = document.createElement("span");
        p.className = "particle";
        p.textContent = "❄";
        p.style.left = Math.random() * 100 + "%";
        p.style.fontSize = (10 + Math.random() * 10) + "px";
        p.style.animationDuration = (8 + Math.random() * 10) + "s";
        p.style.animationDelay = (Math.random() * 10) + "s";
        themeFx.appendChild(p);
      }
    } else if (theme === "dschungel") {
      const colors = ["#e8622c", "#8e44ad", "#ff9a30"];
      for (let i = 0; i < 6; i++) {
        const p = document.createElement("span");
        p.className = "particle";
        const size = 140 + Math.random() * 120;
        p.style.width = size + "px";
        p.style.height = size + "px";
        p.style.left = Math.random() * 90 + "%";
        p.style.top = Math.random() * 90 + "%";
        p.style.background = colors[i % colors.length];
        p.style.animationDelay = (Math.random() * 4) + "s";
        themeFx.appendChild(p);
      }
    }
  }

  // Theme-Karte angeklickt -> Theme anwenden und weiter zur Fragenanzahl.
  themeButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      applyTheme(btn.dataset.theme);
      screenTheme.classList.add("hidden");
      screenSelect.classList.remove("hidden");
    });
  });

  // "Theme wechseln" in den Einstellungen -> zurück zur Theme-Auswahl,
  // egal auf welchem Bildschirm man gerade war.
  changeThemeBtn.addEventListener("click", () => {
    settingsPanel.classList.remove("visible");
    screenSelect.classList.add("hidden");
    screenQuiz.classList.add("hidden");
    screenResult.classList.add("hidden");
    progressTrack.hidden = true;
    screenTheme.classList.remove("hidden");
  });

  logoutBtn.addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "login.html";
  });

  // --- 5. Fragen aus questions.json laden -----------------------------
  async function loadQuestions() {
    const response = await fetch("./questions.json");
    const raw = await response.json();

    // Jede Frage bekommt automatisch eine ID nach ihrer Position im
    // Array (q0, q1, q2, ...), falls noch keine "id" im JSON steht.
    allQuestions = raw.map((q, index) => ({
      id: q.id || ("q" + index),
      ...q
    }));

    poolInfo.textContent = `${allQuestions.length} Fragen verfügbar. Wähle eine Menge:`;
  }

  // Prüft in Firestore, ob es Fragen gibt, die diese Nutzerin zuletzt
  // falsch beantwortet hat, und zeigt den "Wiederholen"-Button an.
  async function checkReviewPool() {
    const statsRef = collection(db, "users", currentUser.uid, "questionStats");
    const q = query(statsRef, where("lastResult", "==", "wrong"));
    const snapshot = await getDocs(q);

    if (!snapshot.empty) {
      reviewBtn.textContent = `Falsch beantwortete wiederholen (${snapshot.size})`;
      reviewBtn.classList.remove("hidden");
      reviewBtn.dataset.ids = JSON.stringify(snapshot.docs.map(d => d.id));
    } else {
      reviewBtn.classList.add("hidden");
    }
  }

  // --- 6. Zufällige Auswahl starten -----------------------------------
  function shuffle(array) {
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  countButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      const count = parseInt(btn.dataset.count, 10);
      sessionQuestions = shuffle(allQuestions).slice(0, count);
      startSession();
    });
  });

  reviewBtn.addEventListener("click", () => {
    const ids = JSON.parse(reviewBtn.dataset.ids || "[]");
    sessionQuestions = shuffle(allQuestions.filter(q => ids.includes(q.id)));
    startSession();
  });

  function startSession() {
    answers = sessionQuestions.map(q => ({ questionId: q.id, selected: null, isCorrect: null }));
    currentIndex = 0;
    screenSelect.classList.add("hidden");
    screenResult.classList.add("hidden");
    screenQuiz.classList.remove("hidden");
    progressTrack.hidden = false;
    renderQuestion();
  }

  // --- 7. Eine Frage anzeigen -------------------------------------------
  function renderQuestion() {
    const q = sessionQuestions[currentIndex];
    const answer = answers[currentIndex];

    questionCounterEl.textContent =
      `Frage ${currentIndex + 1} von ${sessionQuestions.length}`;

    const answeredCount = answers.filter(a => a.selected !== null).length;
    progressFill.style.width = `${(answeredCount / sessionQuestions.length) * 100}%`;

    questionTextEl.textContent = q.question;
    optionsContainer.innerHTML = "";
    explanationEl.classList.remove("visible");

    Object.entries(q.options).forEach(([letter, text]) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.type = "button";
      btn.innerHTML = `<span class="letter">${letter}</span><span>${text}</span>`;

      // Wenn diese Frage schon beantwortet wurde: Ergebnis anzeigen,
      // weitere Klicks blockieren (Antwort ist final).
      if (answer.selected !== null) {
        btn.disabled = true;
        if (letter === q.correct) btn.classList.add("correct");
        if (letter === answer.selected && letter !== q.correct) btn.classList.add("wrong");
      } else {
        btn.addEventListener("click", () => selectAnswer(letter));
      }

      optionsContainer.appendChild(btn);
    });

    if (answer.selected !== null) {
      explanationEl.textContent = q.explanation || "";
      explanationEl.classList.add("visible");
    }

    prevBtn.disabled = currentIndex === 0;
    const isLast = currentIndex === sessionQuestions.length - 1;
    const allAnswered = answers.every(a => a.selected !== null);

    nextBtn.disabled = answer.selected === null;
    nextBtn.textContent = (isLast && allAnswered) ? "Auswertung anzeigen" : "Weiter";
  }

  // --- 8. Antwort auswählen -----------------------------------------------
  function selectAnswer(letter) {
    const q = sessionQuestions[currentIndex];
    answers[currentIndex] = {
      questionId: q.id,
      selected: letter,
      isCorrect: letter === q.correct
    };
    renderQuestion();
  }

  prevBtn.addEventListener("click", () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion();
    }
  });

  nextBtn.addEventListener("click", () => {
    const isLast = currentIndex === sessionQuestions.length - 1;
    const allAnswered = answers.every(a => a.selected !== null);

    if (isLast && allAnswered) {
      finishSession();
    } else if (currentIndex < sessionQuestions.length - 1) {
      currentIndex++;
      renderQuestion();
    }
  });

  // --- 9. Runde abschließen: Auswerten + in Firestore speichern -----------
  async function finishSession() {
    const correctCount = answers.filter(a => a.isCorrect).length;
    const wrongCount = answers.length - correctCount;
    const percent = Math.round((correctCount / answers.length) * 100);

    // IHK-Notenskala (Prozent -> Note)
    let note;
    if (percent >= 92) note = 1;
    else if (percent >= 81) note = 2;
    else if (percent >= 67) note = 3;
    else if (percent >= 50) note = 4;
    else if (percent >= 30) note = 5;
    else note = 6;

    resultGrade.textContent = "Note " + note;
    resultPercent.textContent = `${percent}% richtig`;
    resultCorrect.textContent = correctCount;
    resultWrong.textContent = wrongCount;

    // Für jede beantwortete Frage einen Statistik-Eintrag in Firestore
    // anlegen/aktualisieren, damit die Wiederholungsfunktion und der
    // Lernfortschritt gespeichert bleiben.
    const savePromises = answers.map(a => {
      const ref = doc(db, "users", currentUser.uid, "questionStats", a.questionId);
      return setDoc(ref, {
        lastResult: a.isCorrect ? "correct" : "wrong",
        lastAnsweredAt: new Date().toISOString(),
        timesCorrect: increment(a.isCorrect ? 1 : 0),
        timesWrong: increment(a.isCorrect ? 0 : 1)
      }, { merge: true });
    });
    await Promise.all(savePromises);

    screenQuiz.classList.add("hidden");
    progressTrack.hidden = true;
    screenResult.classList.remove("hidden");
    questionCounterEl.textContent = "Lernhub";
  }

  backToSelectBtn.addEventListener("click", async () => {
    screenResult.classList.add("hidden");
    screenSelect.classList.remove("hidden");
    await checkReviewPool();
  });

  // Gleiche Fragen, neu gemischt, Antworten zurückgesetzt.
  retryBtn.addEventListener("click", () => {
    sessionQuestions = shuffle(sessionQuestions);
    startSession();
  });

  // --- 10. Einstellungen: Schriftgröße in 5 Stufen -------------------------
  const fontScales = { 1: 0.85, 2: 1, 3: 1.15, 4: 1.3, 5: 1.5 };

  function applyFontSize(step) {
    document.documentElement.style.setProperty("--font-scale", fontScales[step]);
    localStorage.setItem("lernhub-font-step", step);
  }

  // Gespeicherte Einstellung beim Start wiederherstellen.
  const savedStep = localStorage.getItem("lernhub-font-step") || "2";
  fontSlider.value = savedStep;
  applyFontSize(savedStep);

  fontSlider.addEventListener("input", () => applyFontSize(fontSlider.value));

  settingsToggle.addEventListener("click", () => {
    settingsPanel.classList.toggle("visible");
  });
</script>
