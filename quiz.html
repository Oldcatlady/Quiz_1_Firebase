<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIAE Trainer – Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --card-bg: rgba(255, 255, 255, 0.94);
            --card-a: #ffffff;
            --card-b: #ffffff;
            --header-bg: rgba(255, 255, 255, 0.9);
            --theme-ring: var(--accent);
            --menu-btn-bg: rgba(255, 255, 255, 0.9);
            --menu-btn-fg: var(--text-main);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --accent: #315efb;
            --accent-hover: #244bd1;
            --correct: #2e9b68;
            --wrong: #d94b4b;
            --border: color-mix(in srgb, var(--text-muted) 28%, transparent);
            --disabled: color-mix(in srgb, var(--text-muted) 45%, transparent);
            --shadow: 0 4px 22px rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            transition: color 0.25s ease;
        }

        /* ============================================================
           THEME-SYSTEM
           ------------------------------------------------------------
           Jedes Theme setzt eigene Werte für die CSS-Variablen oben
           (Farben für Text, Header, Theme-Kreis, Burgermenü und die
           Auswahl-Karte) und stylt zusätzlich #theme-fx sowie
           .particle für einen animierten, sanft schwebenden
           Hintergrundeffekt. Die Klasse (theme-einhorn / theme-himalaya
           / theme-dschungel) wird per JavaScript auf <body> gesetzt
           (siehe "THEME ANWENDEN" weiter unten im Script).
           Alle Farbpaare wurden mit Blick auf Barrierefreiheit
           (ausreichender Textkontrast) und Augenpflege (keine grellen
           Neontöne, sanfte statt hektische Animationen) gewählt.
           ============================================================ */
        #theme-fx {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        /* ---------- Theme: Einhorn (Regenbogen, Glitzer) — Default ---------- */
        body.theme-einhorn {
            --text-main: #3b1550;
            --text-muted: #7a5b95;
            --accent: #ff5ca8;
            --accent-hover: #e84e94;
            --header-bg: #efe3fb;
            /* zartes Flieder */
            --theme-ring: #ff9ecb;
            /* rosa */
            --menu-btn-bg: #ffd9ac;
            /* pastell orange */
            --menu-btn-fg: #5c3a12;
            --card-bg: #ffeef5;
            --card-a: #ffd9ec;
            --card-b: #ffe3c2;
            background: #2a1b3d;
        }

        body.theme-einhorn #theme-fx {
            background: linear-gradient(120deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1, #8fd3f4, #ff9a9e);
            background-size: 400% 400%;
            animation: rainbowShift 18s ease infinite;
        }

        @keyframes rainbowShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        body.theme-einhorn .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatDrift ease-in-out infinite;
        }

        @keyframes floatDrift {

            0%,
            100% {
                transform: translate(0, 0) scale(0.8);
                opacity: 0.35;
            }

            50% {
                transform: translate(var(--dx, 10px), var(--dy, -16px)) scale(1.25);
                opacity: 1;
            }
        }

        /* ---------- Theme: Himalaya (hell, Schnee-Landschaft) ---------- */
        body.theme-himalaya {
            --text-main: #173b45;
            --text-muted: #4c7a86;
            --accent: #3fb6c9;
            --accent-hover: #2f9dae;
            --header-bg: #e6f0fb;
            /* helles Himmelblau */
            --theme-ring: #4fc1c9;
            /* pastell Teal */
            --menu-btn-bg: #ded1f5;
            /* pastell Flieder */
            --menu-btn-fg: #1f3a4a;
            --card-bg: #f5fcff;
            --card-a: #eef9ff;
            --card-b: #f5f2ff;
            background: #cdeef5;
        }

        body.theme-himalaya #theme-fx {
            background: linear-gradient(180deg, #cdeef5 0%, #eaf6f2 55%, #fffdf6 100%);
        }

        body.theme-himalaya .particle {
            position: absolute;
            top: -8%;
            font-size: 14px;
            animation: snowfall linear infinite;
        }

        @keyframes snowfall {
            to {
                transform: translateY(115vh) translateX(24px);
            }
        }

        /* ---------- Theme: Dschungel (dunkel, warme Akzente) ---------- */
        body.theme-dschungel {
            --text-main: #eaf5ea;
            --text-muted: #9db99f;
            --accent: #e8622c;
            --accent-hover: #c94f20;
            --correct: #5fce7a;
            --wrong: #ff6b6b;
            --header-bg: #17301f;
            /* dunkles Dschungelgrün */
            --theme-ring: #f0b25e;
            /* warmes Gold */
            --menu-btn-bg: #3a2415;
            /* dunkles Braun */
            --menu-btn-fg: #f3cd8e;
            --card-bg: #122318;
            --card-a: #16301f;
            --card-b: #1c2a16;
            background: #0d1b12;
        }

        body.theme-dschungel #theme-fx {
            background:
                radial-gradient(circle at 18% 20%, rgba(232, 98, 44, 0.28), transparent 42%),
                radial-gradient(circle at 82% 28%, rgba(155, 60, 200, 0.22), transparent 46%),
                radial-gradient(circle at 50% 92%, rgba(255, 150, 30, 0.16), transparent 50%),
                #0d1b12;
        }

        body.theme-dschungel .particle {
            position: absolute;
            border-radius: 50%;
            filter: blur(22px);
            animation: glowPulse 6s ease-in-out infinite;
        }

        @keyframes glowPulse {

            0%,
            100% {
                opacity: 0.35;
            }

            50% {
                opacity: 0.75;
            }
        }

        /* Wer reduzierte Bewegung eingestellt hat, bekommt keine Animation
           aufgezwungen (Barrierefreiheit) — die Farben bleiben aber sichtbar. */
        /*@media (prefers-reduced-motion: reduce) {

            #theme-fx,
            .particle {
                animation: none !important;
            }
        }

        /* ===================================================================================
           HEADER
           Hinweis: Dieser Header ist als globales Element für das
           Dashboard und den Nutzerinnen-Account gedacht (Markup + Styles
           1:1 übernehmen). Auf quiz.html sowie login.html/register.html
           bewusst NICHT einbinden.
        ========================= */
        header {
            height: 70px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(6px);
        }

        .header-left,
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-right: 20px;
            color: var(--accent);
        }

        .header-button {
            height: 42px;
            padding: 0 17px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-main);
            border-radius: 9px;
            cursor: pointer;
            font-size: 14px;
        }

        .header-button:hover {
            background: color-mix(in srgb, var(--accent) 10%, transparent);
        }

        /* Theme-Auswahl-Button */
        #themeButton {
            width: 42px;
            height: 42px;
            padding: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff5ca8, #3fb6c9, #e8622c, #ff5ca8);
            border: 3px solid var(--theme-ring);
            box-shadow: 0 0 0 1px var(--border);
            cursor: pointer;
        }

        /* Hamburger */
        #menuButton {
            width: 44px;
            height: 42px;
            padding: 0;
            border: 1px solid color-mix(in srgb, var(--menu-btn-fg) 25%, transparent);
            border-radius: 9px;
            background: var(--menu-btn-bg);
            color: var(--menu-btn-fg);
            cursor: pointer;
            font-size: 22px;
        }

        /* ================================================================================
           MENU
        ========================= */
        #sideMenu {
            position: fixed;
            top: 70px;
            right: 0;
            width: 280px;
            min-height: calc(100vh - 70px);
            background: var(--header-bg);
            border-left: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 25px;
            transform: translateX(100%);
            transition: transform 0.2s ease;
            z-index: 90;
        }

        #sideMenu.open {
            transform: translateX(0);
        }

        #sideMenu h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .menu-item {
            width: 100%;
            text-align: left;
            border: none;
            background: transparent;
            color: var(--text-main);
            padding: 13px 10px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .menu-item:hover {
            background: color-mix(in srgb, var(--accent) 12%, transparent);
        }

        /* ================================================================================
           MAIN
        ========================= */
        main {
            width: min(1100px, calc(100% - 40px));
            margin: 40px auto 70px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 30px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .welcome p {
            color: var(--text-muted);
        }

        /* ======================================================================================
           LEARNING CARD
        ========================= */
        .learning-card {
            background: linear-gradient(135deg, var(--card-a), var(--card-b));
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 30px;
            box-shadow: var(--shadow);
        }

        .learning-card h2 {
            font-size: 21px;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        select {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 15px;
        }

        select:disabled {
            color: var(--disabled);
            cursor: not-allowed;
        }

        select.invalid {
            border: 2px solid var(--wrong);
        }

        .error-message {
            display: none;
            margin-top: 7px;
            color: var(--wrong);
            font-size: 13px;
        }

        .error-message.visible {
            display: block;
        }

        /* ==============================================================================
           QUIZ TYPES
        ========================= */
        .quiz-types {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .quiz-type {
            min-height: 55px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .quiz-type:hover:not(:disabled) {
            border-color: var(--accent);
        }

        .quiz-type.selected {
            border: 2px solid var(--accent);
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 10%, transparent);
        }

        .quiz-type:disabled {
            color: var(--disabled);
            cursor: not-allowed;
        }

        /* ==============================================================================
           FRAGENANZAHL-STEPPER (Karussell: 5,10,...,40, springt an den Enden um)
        ========================= */
        .stepper {
            display: flex;
            align-items: stretch;
            width: 100%;
            max-width: 260px;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .stepper-btn {
            width: 52px;
            border: none;
            background: var(--card-bg);
            color: var(--accent);
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
        }

        .stepper-btn:hover {
            background: color-mix(in srgb, var(--accent) 12%, transparent);
        }

        .stepper-value {
            flex: 1;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
            background: var(--card-bg);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            user-select: none;
        }

        /* ===============================================================================
           START BUTTON
        ========================= */
        .start-container {
            margin-top: 30px;
            text-align: center;
        }

        #startQuiz {
            min-width: 220px;
            height: 52px;
            border: none;
            border-radius: 9px;
            background: var(--accent);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        #startQuiz:hover {
            background: var(--accent-hover);
        }

        /* ======================================================================
           RESPONSIVE
        ========================= */
        @media (max-width: 700px) {
            header {
                padding: 0 15px;
            }

            .logo {
                margin-right: 5px;
            }

            main {
                width: calc(100% - 24px);
                margin-top: 25px;
            }

            .learning-card {
                padding: 20px;
            }

            .quiz-types {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .stepper {
                max-width: none;
            }
        }
    </style>
</head>

<body class="theme-einhorn">
    <div id="theme-fx"></div>
    <!--
     Globaler Header (Dashboard + Nutzerinnen-Konto).
     Bitte NICHT auf quiz.html oder login.html/register.html einbinden —
     dort ist ein reduzierterer/eigener Kopfbereich vorgesehen.
-->
    <header>
        <div class="header-left">
            <div class="logo">
                FIAE TRAINER
            </div>
            <button id="themeButton" title="Theme wechseln" aria-label="Theme wechseln">
            </button>
        </div>
        <div class="header-right">
            <button id="menuButton" aria-label="Menü öffnen">
                ☰
            </button>
        </div>
    </header>
    <!-- =====================================================================================
     BURGERMENÜ
========================= -->
    <nav id="sideMenu">
        <h2>Menü</h2>
        <button class="menu-item" id="dashboardMenu">
            Dashboard
        </button>
        <button class="menu-item">
            Profil
        </button>
        <button class="menu-item">
            Einstellungen
        </button>
        <button class="menu-item">
            AGB
        </button>
        <button class="menu-item">
            Datenschutz
        </button>
        <button class="menu-item" id="logoutButton">
            Logout
        </button>
    </nav>
    <!-- ========================================================================================
     HAUPTINHALT
========================= -->
    <main>
        <section class="welcome">
            <h1 id="welcomeTitle">
                Willkommen zurück!
            </h1>
            <p id="welcomeText">
                Wähle aus, was du heute lernen möchtest.
            </p>
        </section>
        <!-- ===================================================================================
         AUSWAHL
    ========================= -->
        <section class="learning-card">
            <h2>Auswahl</h2>
            <!-- SEMESTER -->
            <div class="form-group">
                <label for="semester">Semester</label>
                <select id="semester">
                    <option value="">Semester auswählen</option>
                    <option value="1">1. Semester</option>
                    <option value="2">2. Semester</option>
                    <option value="extra">Extra</option>
                </select>
            </div>
            <!-- Fach -->
            <div class="form-group">
                <label for="subject">
                    Fach
                </label>
                <select id="subject" disabled>
                    <option value="">
                        Erst Semester auswählen
                    </option>
                </select>
                <div id="subjectError" class="error-message">
                    Bitte wähle zuerst ein Fach aus.
                </div>
            </div>
            <!-- Thema -->
            <div class="form-group">
                <label for="topic">
                    Thema
                </label>
                <select id="topic" disabled>
                    <option value="">
                        Erst Fach auswählen
                    </option>
                </select>
                <div id="topicError" class="error-message">
                    Bitte wähle zuerst ein Thema aus.
                </div>
            </div>
            <!-- Fragenanzahl -->
            <div class="form-group">
                <label id="questionCountLabel" for="questionCountValue">
                    Wie viele Fragen bearbeiten?
                </label>
                <div class="stepper">
                    <button type="button" class="stepper-btn" id="questionCountDown" aria-label="Weniger Fragen">
                        −
                    </button>
                    <div class="stepper-value" id="questionCountValue" role="spinbutton"
                        aria-labelledby="questionCountLabel" aria-valuemin="5" aria-valuemax="40" aria-valuenow="10">
                        10
                    </div>
                    <button type="button" class="stepper-btn" id="questionCountUp" aria-label="Mehr Fragen">
                        +
                    </button>
                </div>
            </div>
            <!-- Quizart -->
            <div class="form-group">
                <label>
                    Quizart
                </label>
                <div class="quiz-types">
                    <button class="quiz-type" data-type="multiple-choice">
                        Multiple Choice
                    </button>
                    <button class="quiz-type" data-type="flashcards">
                        Flashcards
                    </button>
                    <button class="quiz-type" data-type="input">
                        Benutzer-Eingabe
                    </button>
                </div>
                <div id="quizTypeError" class="error-message">
                    Bitte wähle eine Quizart aus.
                </div>
            </div>
            <!-- Start -->
            <div class="start-container">
                <button id="startQuiz">
                    QUIZ STARTEN
                </button>
            </div>
        </section>
    </main>
    <script type="module">
        /*
         * =====================================================
         * FIAE TRAINER — DASHBOARD
         * =====================================================
         * Diese Version benutzt zunächst Testdaten.
         * Die Firebase-Anbindung kann anschließend direkt
         * an deine bestehende Authentifizierung angeschlossen
         * werden.
         */
        /* =======================================================================================
           TESTDATEN
           (Themen bleiben als Datengrundlage bestehen, auch ohne
           eigene Quiz-Thema-Auswahl — das Quiz greift beim Start
           automatisch auf die zum gewählten Thema passenden Fragen zu.)
        ===================================================== */
        const learningData = {
            "Java": {
                "Schleifen": [
                    "for-Schleifen",
                    "while-Schleifen",
                    "do-while-Schleifen"
                ],
                "Arrays": [
                    "Arrays Grundlagen",
                    "Arrays bearbeiten"
                ],
                "Bedingungen": [
                    "if / else",
                    "switch"
                ]
            },
            "Datenbanken": {
                "SQL": [
                    "SELECT",
                    "WHERE",
                    "JOIN"
                ],
                "MariaDB": [
                    "Tabellen",
                    "Datentypen"
                ]
            },
            "Webentwicklung": {
                "HTML": [
                    "Elemente",
                    "Formulare"
                ],
                "CSS": [
                    "Selektoren",
                    "Layout"
                ]
            }
        };
        /* =======================================================================================
           FÄCHER PRO SEMESTER
           "extra" nutzt weiterhin die bestehenden Demo-Fächer aus learningData.
        ===================================================== */
        const semesterSubjects = {
            "1": [
                "Betriebssysteme / Windows",
                "Betriebssysteme / Linux",
                "Datenbanken / MariaDB",
                "Digitaltechnik",
                "Telekommunikationstechnik",
                "Netzwerktechnik",
                "Programmiertechnik / Java",
                "Systemtechnik",
                "Webseiten",
                "WiSo"
            ],
            "2": [
                "Betriebssysteme / Windows",
                "Datenbanken / MariaDB",
                "Telekommunikationstechnik",
                "Programmiertechnik / Java",
                "WiSo",
                "IoT",
                "Docker",
                "Android"
            ],
            "extra": Object.keys(learningData)
        };
        /* =======================================================================================
           ELEMENTE
        ===================================================== */
        const subjectSelect =
            document.getElementById("subject");
        const topicSelect =
            document.getElementById("topic");
        const startQuiz =
            document.getElementById("startQuiz");
        const themeButton =
            document.getElementById("themeButton");
        const menuButton =
            document.getElementById("menuButton");
        const sideMenu =
            document.getElementById("sideMenu");
        const quizTypeButtons =
            document.querySelectorAll(".quiz-type");
        const themeFx =
            document.getElementById("theme-fx");
        let selectedQuizType = null;
        /* ================================================================================================
           SEMESTER AUSGEWÄHLT → FÄCHER LADEN
        ===================================================== */
        const semesterSelect =
            document.getElementById("semester");

        semesterSelect.addEventListener("change", () => {
            const semester =
                semesterSelect.value;
            /* Fach + Thema zurücksetzen */
            subjectSelect.innerHTML =
                '<option value="">Fach auswählen</option>';
            topicSelect.innerHTML =
                '<option value="">Erst Fach auswählen</option>';
            topicSelect.disabled = true;
            if (!semester) {
                subjectSelect.disabled = true;
                return;
            }
            subjectSelect.disabled = false;
            semesterSubjects[semester].forEach(subject => {
                const option =
                    document.createElement("option");
                option.value = subject;
                option.textContent = subject;
                subjectSelect.appendChild(option);
            });
        });
        /* =================================================================================================
           FACH AUSGEWÄHLT
        ===================================================== */
        subjectSelect.addEventListener("change", () => {
            const subject =
                subjectSelect.value;
            /* Thema zurücksetzen */
            topicSelect.innerHTML =
                '<option value="">Thema auswählen</option>';
            if (!subject) {
                topicSelect.disabled = true;
                return;
            }
            topicSelect.disabled = false;
            /* Fächer aus "Extra" haben feste Unterthemen, alle
               anderen starten direkt mit "Alle Themen". */
            const topics =
                learningData[subject]
                    ? Object.keys(learningData[subject])
                    : ["Alle Themen"];
            topics.forEach(topic => {
                const option =
                    document.createElement("option");
                option.value = topic;
                option.textContent = topic;
                topicSelect.appendChild(option);
            });
        });
        /* =====================================================
           QUIZART
        ===================================================== */
        quizTypeButtons.forEach(button => {
            button.addEventListener("click", () => {
                quizTypeButtons.forEach(btn => {
                    btn.classList.remove("selected");
                });
                button.classList.add("selected");
                selectedQuizType =
                    button.dataset.type;
            });
        });
        /* =====================================================
           FRAGENANZAHL (Karussell-Stepper)
           Erlaubte Werte: 5,10,15,20,25,30,35,40 — springt am
           Ende jeweils zum Anfang bzw. Ende zurück.
        ===================================================== */
        const questionCounts =
            [5, 10, 15, 20, 25, 30, 35, 40];
        let questionCountIndex =
            questionCounts.indexOf(10);
        const questionCountValue =
            document.getElementById("questionCountValue");
        const questionCountUp =
            document.getElementById("questionCountUp");
        const questionCountDown =
            document.getElementById("questionCountDown");

        function renderQuestionCount() {
            const value =
                questionCounts[questionCountIndex];
            questionCountValue.textContent = value;
            questionCountValue.setAttribute(
                "aria-valuenow",
                value
            );
        }
        questionCountUp.addEventListener("click", () => {
            questionCountIndex =
                (questionCountIndex + 1) % questionCounts.length;
            renderQuestionCount();
        });
        questionCountDown.addEventListener("click", () => {
            questionCountIndex =
                (questionCountIndex - 1 + questionCounts.length)
                % questionCounts.length;
            renderQuestionCount();
        });
        /* =====================================================
           QUIZ STARTEN
        ===================================================== */
        startQuiz.addEventListener("click", () => {
            let valid = true;
            /* Fach */
            if (!subjectSelect.value) {
                subjectSelect.classList.add("invalid");
                document
                    .getElementById("subjectError")
                    .classList.add("visible");
                valid = false;
            } else {
                subjectSelect.classList.remove("invalid");
                document
                    .getElementById("subjectError")
                    .classList.remove("visible");
            }
            /* Thema */
            if (!topicSelect.value) {
                topicSelect.classList.add("invalid");
                document
                    .getElementById("topicError")
                    .classList.add("visible");
                valid = false;
            } else {
                topicSelect.classList.remove("invalid");
                document
                    .getElementById("topicError")
                    .classList.remove("visible");
            }
            /* Quizart */
            if (!selectedQuizType) {
                document
                    .getElementById("quizTypeError")
                    .classList.add("visible");
                valid = false;
            } else {
                document
                    .getElementById("quizTypeError")
                    .classList.remove("visible");
            }
            if (!valid) {
                return;
            }
            /*
             * Vorläufig speichern wir die Auswahl.
             * Die eigentliche Quizseite kommt im nächsten Schritt
             * und greift anhand von subject/topic automatisch auf
             * die passenden Fragen zu.
             */
            const quizSelection = {
                subject: subjectSelect.value,
                topic: topicSelect.value,
                questionCount: questionCounts[questionCountIndex],
                quizType: selectedQuizType
            };
            sessionStorage.setItem(
                "quizSelection",
                JSON.stringify(quizSelection)
            );
            /*
             * Vorläufige Meldung.
             * Sobald quiz.html existiert, ersetzen wir
             * diesen Teil durch:
             * window.location.href = "quiz.html";
             */
            alert(
                "Auswahl gespeichert.\n\n" +
                "Fach: " + quizSelection.subject + "\n" +
                "Thema: " + quizSelection.topic + "\n" +
                "Fragenanzahl: " + quizSelection.questionCount + "\n" +
                "Quizart: " + quizSelection.quizType
            );
        });
        /* =====================================================
           THEME ANWENDEN
        ===================================================== */
        const themes =
            ["theme-einhorn", "theme-himalaya", "theme-dschungel"];
        let currentTheme = 0;

        /* Helle Pastellfarben (inkl. Weiß) für die schwebenden "Sternchen" im
           Einhorn-Theme, und vier unterschiedliche Größen dafür. */
        const einhornParticleColors =
            ["#e0f3ff", "#f0e4ff", "#ffe9c9", "#ffffff"];
        const einhornParticleSizes =
            [2, 4, 6, 8];

        function generateParticles(theme) {
            themeFx.innerHTML = "";
            if (theme === "theme-einhorn") {
                for (let i = 0; i < 36; i++) {
                    const p = document.createElement("div");
                    p.className = "particle";
                    const color =
                        einhornParticleColors[
                        i % einhornParticleColors.length
                        ];
                    const size =
                        einhornParticleSizes[
                        Math.floor(Math.random() * einhornParticleSizes.length)
                        ];
                    p.style.width = size + "px";
                    p.style.height = size + "px";
                    p.style.left = Math.random() * 100 + "%";
                    p.style.top = Math.random() * 100 + "%";
                    p.style.background = color;
                    p.style.boxShadow =
                        "0 0 " + (size + 3) + "px 2px " + color + "cc";
                    p.style.setProperty(
                        "--dx",
                        (Math.random() * 30 - 15) + "px"
                    );
                    p.style.setProperty(
                        "--dy",
                        (-(12 + Math.random() * 22)) + "px"
                    );
                    p.style.animationDuration =
                        (1,3 + Math.random() * 1.0) + "s";
                    p.style.animationDelay =
                        (Math.random() * 1.5) + "s";
                    themeFx.appendChild(p);
                }
            } else if (theme === "theme-himalaya") {
                for (let i = 0; i < 45; i++) {
                    const p = document.createElement("div");
                    p.className = "particle";
                    p.textContent = "❄";
                    p.style.left = Math.random() * 100 + "%";
                    p.style.color =
                        Math.random() > 0.6 ? "#cfe9f2" : "#ffffff";
                    p.style.textShadow =
                        "0 0 4px rgba(255,255,255,0.9)";
                    p.style.fontSize =
                        (10 + Math.random() * 10) + "px";
                    p.style.opacity = 0.5 + Math.random() * 0.5;
                    p.style.animationDuration =
                        (8 + Math.random() * 10) + "s";
                    p.style.animationDelay =
                        (Math.random() * 10) + "s";
                    themeFx.appendChild(p);
                }
            } else if (theme === "theme-dschungel") {
                const glowColors =
                    ["#e8622c", "#9b3cc8", "#ff961e", "#5fce7a"];
                for (let i = 0; i < 6; i++) {
                    const p = document.createElement("div");
                    p.className = "particle";
                    const size = 140 + Math.random() * 160;
                    p.style.width = size + "px";
                    p.style.height = size + "px";
                    p.style.left = Math.random() * 100 + "%";
                    p.style.top = Math.random() * 100 + "%";
                    p.style.background =
                        glowColors[i % glowColors.length];
                    p.style.animationDelay =
                        (Math.random() * 6) + "s";
                    themeFx.appendChild(p);
                }
            }
        }

        function applyTheme(theme) {
            document.body.classList.remove(...themes);
            document.body.classList.add(theme);
            generateParticles(theme);
            localStorage.setItem("lernhubTheme", theme);
        }

        themeButton.addEventListener("click", () => {
            currentTheme =
                (currentTheme + 1) % themes.length;
            applyTheme(themes[currentTheme]);
        });
        /* gespeichertes Theme laden, sonst Einhorn (Default) */
        const savedTheme =
            localStorage.getItem("lernhubTheme");
        const savedIndex =
            savedTheme ? themes.indexOf(savedTheme) : 0;
        currentTheme =
            savedIndex !== -1 ? savedIndex : 0;
        applyTheme(themes[currentTheme]);
        /* =====================================================
           BURGERMENÜ
        ===================================================== */
        menuButton.addEventListener("click", () => {
            sideMenu.classList.toggle("open");
        });
        document
            .getElementById("dashboardMenu")
            .addEventListener("click", () => {
                sideMenu.classList.remove("open");
            });
        /* =====================================================
           LOGOUT
        ===================================================== */
        document
            .getElementById("logoutButton")
            .addEventListener("click", () => {
                /*
                 * Hier schließen wir anschließend
                 * Firebase Authentication an.
                 */
                window.location.href =
                    "login.html";
            });
    </script>
</body>

</html>
